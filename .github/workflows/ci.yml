name: CI

# The same gate the repository already runs locally, run again where
# it cannot be skipped. Nothing here is new policy: CLAUDE.md's build
# commands are the source, and a job that drifts from them is the bug.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # No job here pushes, and a checkout that leaves a token in
          # .git/config hands one to every later step.
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      # The suite builds real repositories with real worktrees, so the
      # runner's git is part of what is under test. Print it: a failure
      # that only reproduces on one git version is otherwise a mystery.
      - name: Show the git version under test
        run: git --version
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          # The higher of the two floors, which today is the root
          # module's. Toolchain selection ignores -modfile and setup-go
          # pins GOTOOLCHAIN=local, so one installed toolchain has to
          # satisfy both: golangci-lint is built from tools/go.mod
          # (go 1.25.0) but type-checks a module requiring go 1.25.11,
          # and installing the tools floor fails on exactly that.
          go-version-file: go.mod
          # setup-go keys its module cache on the root go.sum alone,
          # while golangci-lint builds from tools/go.sum and
          # type-checks the repository against go.sum. Hash both, or
          # the tool's whole dependency tree downloads again on every
          # run.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: go tool -modfile=tools/go.mod golangci-lint run

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Pinned to the same mdsmith version go.mod imports, so the
      # linter and the library frit parses plans with are one release.
      # Bump both together.
      - uses: jeduden/mdsmith@2ab4b2949e9420b2eb73f4239091fd647c4b5e80 # v0.54.0
        with:
          version: v0.54.0
          args: check .

  # Workflows are the newest attack surface in this repository and the
  # only part of it not covered by go vet. zizmor reads them for the
  # mistakes that matter here — an unpinned action, a token left in a
  # checkout, an input interpolated into a shell.
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # zizmor's own action, not a pip install. `pip install zizmor==x`
      # resolves against PyPI at run time and verifies nothing; the
      # action pulls ghcr.io/zizmorcore/zizmor by immutable digest,
      # read from a version-to-digest table shipped inside the action
      # itself, so what runs is fixed by content rather than by name.
      #
      # It also hands zizmor ${{ github.token }} on its own, which is
      # what turns on the three audits that need the API —
      # impostor-commit, ref-confusion and known-vulnerable-actions.
      # Those are the ones that check a pinned SHA is what it claims
      # to be, and they skip in silence without it.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Pin the analyser too. The default is `latest`, which would
          # resolve at run time and make the job's result depend on the
          # day it ran. Dependabot bumps the action's SHA but not this
          # string, so it is a hand bump.
          version: "1.29.0"
          # Fail the job on findings. The default files them into code
          # scanning instead and exits clean, which is the right shape
          # when a ruleset does the gating; here the check itself is
          # the gate.
          advanced-security: false
