version: 2

# Pinning every action by SHA is what makes a workflow reproducible,
# and it is also what makes it go stale silently: a pin never asks to
# be updated. This is the thing that asks.
updates:
  # A week of cooldown on every ecosystem below. Without one, dependabot
  # offers a version the moment it is published, which is exactly the
  # window a compromised release is live in before it is yanked. Seven
  # days is what zizmor's dependabot-cooldown audit asks for.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    # One pull request for all of them. Six action pins bumped
    # separately is six reviews of the same kind of diff.
    groups:
      actions:
        patterns: ["*"]
    # The mdsmith action is deliberately not grouped in: its version
    # must move with the library in go.mod, so that bump is a decision
    # rather than a merge. See the CI and Release section of
    # CLAUDE.md.
    ignore:
      - dependency-name: "jeduden/mdsmith"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    # The golang.org/x releases below require go 1.26, and taking one
    # raises go.mod's go directive past the floor gofloor_test.go
    # holds. Each would open a pull request that can never go green,
    # and with a limit of one it would hold the only slot and starve
    # every other module bump. Lift these together with goFloor.
    ignore:
      - dependency-name: "golang.org/x/term"
        versions: [">= 0.46.0"]
      - dependency-name: "golang.org/x/sys"
        versions: [">= 0.48.0"]
      - dependency-name: "golang.org/x/sync"
        versions: [">= 0.23.0"]

  # Dev tools build from their own modfile, so they update on their
  # own schedule and never constrain consumers of this module.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
