front-matter: true

rules:
  line-length:
    max: 80
    exclude:
      - code-blocks
      - tables
      - urls
  heading-style:
    style: atx
  heading-increment: true
  first-line-heading:
    level: 1
  empty-section-body:
    min-level: 2
    max-level: 6
    allow-marker: allow-empty-section
  no-duplicate-headings: true
  no-trailing-spaces: true
  no-hard-tabs: true
  no-multiple-blanks:
    max: 1
  single-trailing-newline: true
  fenced-code-style:
    style: backtick
  fenced-code-language: true
  no-bare-urls: true
  blank-line-around-headings: true
  blank-line-around-lists: true
  blank-line-around-fenced-code: true
  list-indent:
    spaces: 2
  table-format:
    pad: 1
  catalog:
    pad: 1
  no-trailing-punctuation-in-heading: true
  no-emphasis-as-heading: true
  # Global, not kind-scoped: a stray markdown file dropped anywhere
  # else — notably under internal/skills/assets, which `all:embed`
  # would bake straight into the binary — fails the lint. This is
  # directory-granular, not filename-granular: it stops a markdown
  # file in an undeclared directory, but a second markdown file
  # dropped beside an already-allowed one still passes.
  directory-structure:
    allowed:
      - "."
      - "docs/**"
      - "plan/**"
      - ".claude/skills/**"
      - "internal/scaffold/assets/**"
      - "internal/skills/assets/*/*"
  cross-file-reference-integrity:
    strict: true
  # Plan ids are the minute-precision UTC creation time, so two
  # machines can allocate one without coordinating. Uniqueness is
  # what makes `frit` able to key a plan as host:repo:id.
  unique-frontmatter:
    field: id
    include:
      - "plan/*.md"
    exclude:
      - "plan/proto.md"

kinds:
  proto:
    # proto.md leads with directives and placeholder headings rather
    # than real content; the structural rules step aside for it.
    rules:
      first-line-heading: false
      heading-increment: false
      blank-line-around-headings: false
      no-duplicate-headings: false
      no-emphasis-as-heading: false
      cross-file-reference-integrity: false
      paragraph-readability: false
      paragraph-structure: false
  plan:
    path-pattern: "plan/{proto.md,[0-9][0-9]*_*.md}"
    rules:
      required-structure:
        schema: plan/proto.md
  embedded-proto:
    # frit init ships plan/proto.md from an embedded copy in
    # internal/scaffold/assets. Like plan/proto.md, the copy is its own
    # schema: pointing required-structure back at the file marks it as a
    # schema file, which is what stops MDS020 firing on the <?require?>
    # inside it. A Go test pins the copy byte-equal to plan/proto.md.
    path-pattern: "internal/scaffold/assets/proto.md"
    rules:
      required-structure:
        schema: internal/scaffold/assets/proto.md
  skill:
    # Skills frit ships: the canonical text in
    # internal/skills/assets/<name>/SKILL.md, and its dogfooded copy in
    # .claude/skills/<name>/SKILL.md that `frit skills` writes. A skill
    # is a procedure an agent follows under time pressure, and it loads
    # into a working session, so every line is paid for. Readability
    # stays ON — padded prose costs a skimmed reader a missed step —
    # and every rule below forces a skill to earn its bytes: file and
    # section length, token budget, paragraph shape, and a filler ban.
    # All four shipped skills sit under every cap today with modest
    # headroom, so these are live constraints, not aspiration.
    path-pattern: "{internal/skills/assets,.claude/skills}/*/SKILL.md"
    rules:
      required-frontmatter:
        fields: [name, description]
      # Uniqueness is scoped to the canonical source: the .claude/skills
      # copy carries the same names by design, so including it would read
      # the dogfood as a duplicate.
      unique-frontmatter:
        field: name
        include:
          - "internal/skills/assets/*/SKILL.md"
      table-readability: false
      # Tightened further, toward the real ceiling: the largest
      # skill today is 56 lines.
      max-file-length:
        max: 65
      # A skill loads into a working session, so tokens are the real
      # cost, not lines. 650 heuristic tokens is well above the
      # largest skill today (plan-phase, about 552) with headroom to
      # grow, but tight enough to catch bloat before it ships.
      token-budget:
        mode: heuristic
        max: 650
      paragraph-structure:
        max-sentences: 6
        max-words-per-sentence: 35
      # No `## Method` sprawls: the longest section today is 33 lines.
      max-section-length:
        per-level:
          1: 10
          2: 40
      # Filler that pads a skill without adding a step. None of the
      # four shipped skills use any of these phrases today.
      forbidden-text:
        contains:
          - "in order to"
          - "please note"
          - "it is important to"
          - "as mentioned"
      forbidden-paragraph-starts:
        starts:
          - "Please note"
          - "It is important to"
          - "As mentioned"
      # duplicated-content (MDS037) is explicitly rejected here: the
      # .claude/skills copy is byte-identical to its asset by design
      # (Phase 1's pin), so it would false-fire across the whole
      # suite. Left disabled, which is also its repo-wide default.

# Order matters: proto applies first so plan/proto.md also picks up
# the plan kind, whose required-structure.schema points back at the
# file itself. That marks it as its own schema, which is what stops
# MDS020 firing on the <?require?> inside it.
kind-assignment:
  - glob: ["**/proto.md"]
    kinds: [proto]
  - glob: ["plan/*.md"]
    kinds: [plan]
  - glob: ["internal/scaffold/assets/proto.md"]
    kinds: [embedded-proto]
  - glob:
      - "internal/skills/assets/*/SKILL.md"
      - ".claude/skills/*/SKILL.md"
    kinds: [skill]

overrides:
  # Research notes are a record of how a decision was reached, not
  # reference prose. They carry long quoted tables, survey matrices and
  # links to tools that may move, so the structural and readability
  # rules that target docs step aside — same override mdsmith applies
  # to its own docs/research/**.
  - glob: ["docs/research/**"]
    rules:
      first-line-heading: false
      heading-increment: false
      paragraph-readability: false
      paragraph-structure: false
      max-file-length: false
      cross-file-reference-integrity: false
      required-structure: false

ignore:
  - ".github/**"
